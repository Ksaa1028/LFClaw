<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LFClaw · 分享对话 / Shared conversation</title>
<style nonce="__NONCE__">
body{font:16px/1.65 system-ui,sans-serif;color:#202b3e;background:#f5f7fa;margin:0}main{max-width:900px;margin:40px auto;padding:24px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}article,form,aside{background:white;padding:22px;border:1px solid #dfe5ed;border-radius:12px;margin:16px 0}h1{font-size:26px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}button,a.button{display:inline-block;border:0;border-radius:7px;padding:10px 16px;background:#2563eb;color:white;cursor:pointer;text-decoration:none}input{padding:10px;border:1px solid #bcc7d8;border-radius:6px;max-width:90%}small{color:#586579}#error{color:#a32121;white-space:pre-wrap}label{display:block;margin-bottom:12px}button:disabled{opacity:.5}#files button{margin:4px}
</style></head><body><main>
<header><strong>LFClaw</strong><select id="language" aria-label="Language"><option value="zh">中文</option><option value="en">English</option></select></header>
<h1 id="title">分享对话</h1><p id="description"></p>
<form id="login"><label id="loginLabel" for="code"></label><input id="code" type="password" autocomplete="off" maxlength="200" required><button id="signIn" type="submit"></button></form>
<p id="error" role="alert"></p><aside id="actions" hidden><p id="source"></p><p id="notice"></p><a class="button" id="continue"></a> <button id="copyConversation"></button> <button id="copy"></button><p id="fallback"></p><div id="files"></div></aside><section id="messages"></section>
</main><script nonce="__NONCE__">
const words={zh:{title:'分享对话',description:'登录后查看分享时的对话副本。不需要安装或升级客户端。',login:'输入你的企业激活码验证身份（不会更改设备激活）',signIn:'验证并查看',notice:'后续消息不会自动同步。新版客户端可一键接收续聊；旧版客户端可复制完整对话，再粘贴到普通新对话继续使用。',continue:'在新版 LFClaw 中接收并续聊',copyConversation:'复制完整对话内容',conversationCopied:'完整对话已复制',copy:'复制分享链接',copied:'链接已复制',copyFailed:'复制失败，请选择页面内容手动复制。',fallback:'客户端没有“收到的分享”也不影响查看。旧版可使用上方“复制完整对话内容”，粘贴到普通新对话继续聊。',user:'发送人',assistant:'助手',failed:'无法查看，请检查身份、权限或网络后重试。',loginFailed:'验证失败，请检查激活码。',from:'分享人：',snapshotNotice:'以下是分享时的固定对话副本，后续消息不会自动同步。'},en:{title:'Shared conversation',description:'Sign in to view a snapshot. No desktop installation or update is needed.',login:'Enter your enterprise activation code (device activation is unchanged)',signIn:'Sign in and view',notice:'Later messages are not synced. New clients can receive and continue in one step; older clients can copy the full conversation into a normal new chat.',continue:'Receive and continue in the new LFClaw client',copyConversation:'Copy full conversation',conversationCopied:'Full conversation copied',copy:'Copy share link',copied:'Link copied',copyFailed:'Copy failed. Select the page content and copy it manually.',fallback:'A Received shares screen is not required. In an older client, copy the full conversation above and paste it into a normal new chat.',user:'Sender',assistant:'Assistant',failed:'Unable to view. Check your identity, permissions or connection and retry.',loginFailed:'Sign-in failed. Check the activation code.',from:'Shared by: ',snapshotNotice:'This is a fixed snapshot. Later messages are not synced.'}};
let lang=navigator.language.startsWith('zh')?'zh':'en';let snapshot=null;let token='';
const el=id=>document.getElementById(id);const id=location.pathname.split('/').pop();
function labels(){const w=words[lang];document.documentElement.lang=lang;el('title').textContent=snapshot?.title||w.title;el('description').textContent=w.description;el('loginLabel').textContent=w.login;el('signIn').textContent=w.signIn;el('notice').textContent=w.notice;el('continue').textContent=w.continue;el('copyConversation').textContent=w.copyConversation;el('copy').textContent=w.copy;el('fallback').textContent=w.fallback;if(snapshot)render();}
async function copyText(value){if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(value);return;}const area=document.createElement('textarea');area.value=value;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();const copied=document.execCommand('copy');area.remove();if(!copied)throw new Error('copy failed');}
function transcript(){const w=words[lang];const turns=snapshot.messages.map(message=>{const author=message.role==='user'?snapshot.sender.name:w.assistant;return '['+author+' · '+new Date(message.timestamp).toLocaleString()+']\n'+message.content;});return snapshot.title+'\n'+w.from+snapshot.sender.name+'\n'+w.snapshotNotice+'\n\n'+turns.join('\n\n');}
function render(){const w=words[lang];el('title').textContent=snapshot.title;el('source').textContent=w.from+snapshot.sender.name+' · '+new Date(snapshot.createdAt).toLocaleString();el('messages').replaceChildren();for(const message of snapshot.messages){const article=document.createElement('article');const label=document.createElement('small');label.textContent=(message.role==='user'?snapshot.sender.name:w.assistant)+' · '+new Date(message.timestamp).toLocaleString();const body=document.createElement('pre');body.textContent=message.content;article.append(label,body);el('messages').append(article);}el('files').replaceChildren();for(const attachment of snapshot.attachments){const button=document.createElement('button');button.textContent=attachment.name+' ('+attachment.size+' B)';button.onclick=()=>{const bytes=Uint8Array.from(atob(attachment.base64),x=>x.charCodeAt(0));const url=URL.createObjectURL(new Blob([bytes],{type:'application/octet-stream'}));const a=document.createElement('a');a.href=url;a.download=attachment.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};el('files').append(button);}}
el('language').value=lang;el('language').onchange=()=>{lang=el('language').value;labels();};
el('continue').href='lobsterai://conversation-share/'+id+'?server='+encodeURIComponent(location.origin);
el('copyConversation').onclick=async()=>{if(!snapshot)return;try{await copyText(transcript());el('copyConversation').textContent=words[lang].conversationCopied;el('error').textContent='';}catch{el('error').textContent=words[lang].copyFailed;}};
el('copy').onclick=async()=>{try{await copyText(location.href);el('copy').textContent=words[lang].copied;el('error').textContent='';}catch{el('error').textContent=location.href;}};
el('login').onsubmit=async event=>{event.preventDefault();el('error').textContent='';el('signIn').disabled=true;try{const response=await fetch('/api/share/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({activationCode:el('code').value}),signal:AbortSignal.timeout(15000)});if(!response.ok)throw new Error(words[lang].loginFailed);token=(await response.json()).data.token;el('code').value='';const result=await fetch('/api/enterprise/conversation-shares/'+id,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(30000)});if(!result.ok)throw new Error(words[lang].failed);snapshot=(await result.json()).data;el('login').hidden=true;el('actions').hidden=false;render();}catch(error){el('error').textContent=error.message||words[lang].failed;}finally{el('signIn').disabled=false;}};labels();
</script></body></html>
